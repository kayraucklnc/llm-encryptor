[project]
name = "llm-encryptor"
version = "0.1.0"
description = "Hide an encrypted message inside ordinary-looking text written by a local LLM."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["cryptography>=42", "rich>=13"]

[project.scripts]
llm-encryptor = "llm_encryptor.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_encryptor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
